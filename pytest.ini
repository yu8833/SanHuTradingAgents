[pytest]
# 测试收集范围：只看 tests/ 目录
testpaths = tests

# 文件名模式（默认即可，收集所有 test_*.py）
python_files = test_*.py

# 标记定义（严格模式 --strict-markers，未登记的标记会报错）
markers =
    smoke: 冒烟测试，覆盖核心端点最小正向路径，CI 必跑
    unit: 单元测试，不依赖外部服务
    integration: 集成测试，需要真实 DB/Redis/外部 API（默认跳过）
    contract: API 契约测试，基于 OpenAPI schema 的自动遍历
    regression: 防回归测试，每个已修复 bug 对应的钉住用例

# 异步模式
asyncio_mode = auto

# 默认运行选项：
#   -v 详细输出
#   --tb=short 精简堆栈
#   --strict-markers 未登记标记视为错误
#   -m "not integration" 默认跳过需要外部服务的集成测试
#   --ignore=tests/_archive 忽略归档目录
#   --cov=app 启用代码覆盖率（仅统计 app/ 包）
#   --cov-report=term-missing 终端显示未覆盖行
#   --cov-report=xml:coverage.xml 生成 cobertura XML（CI 上传）
#   --cov-fail-under=10 初始覆盖率门槛 10%，后续每月提升 5%
addopts =
    -v
    --tb=short
    --strict-markers
    -m "not integration"
    --ignore=tests/_archive
    --ignore=tests/0.1.14
    --ignore=tests/tradingagents
    --ignore=tests/dataflows
    --ignore=tests/config
    --ignore=tests/services
    --ignore=tests/middleware
    --ignore=tests/system
    --ignore=tests/integration
    --ignore=tests/test_tushare_unified
    --ignore=tests/unit
    -p no:cacheprovider
    --cov=app
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    --cov-fail-under=2

# 覆盖率报告：排除测试相关代码
[coverage:run]
omit =
    app/tests/*
    tests/*
    */tests/*
    *test*.py
    */conftest.py
    */site-packages/*
