# mypy 配置：渐进式收紧策略
# -----------------------------------------------
# 收紧节奏：
#   Phase 1 (当前): app/core 全部必须有类型标注
#   Phase 2 (下一月): app/services 全部必须有类型标注
#   Phase 3 (下二月): app/routers 全部必须有类型标注
#   Phase 4 (下三月): app/* 全模块严格模式
# -----------------------------------------------

[mypy]
python_version = "3.10"
ignore_missing_imports = True
warn_return_any = False
warn_unused_configs = False
no_implicit_optional = True

# 默认保持宽松，按模块逐批收紧
disallow_untyped_defs = False
check_untyped_defs = False

# ---------- Phase 1：app/core 强制类型标注 ----------
[mypy-app.core.*]
ignore_missing_imports = True
disallow_untyped_defs = True
check_untyped_defs = True

# ---------- Phase 2：app/services 强制类型标注 ----------
[mypy-app.services.*]
ignore_missing_imports = True
disallow_untyped_defs = True
check_untyped_defs = True

# ---------- 其他模块保持宽松，后续逐批收紧 ----------
[mypy-app.routers.*]
ignore_missing_imports = True
disallow_untyped_defs = False
check_untyped_defs = False

[mypy-app.worker.*]
ignore_missing_imports = True
disallow_untyped_defs = False
check_untyped_defs = False

[mypy-app.middleware.*]
ignore_missing_imports = True
disallow_untyped_defs = False
check_untyped_defs = False

[mypy-tests.*]
ignore_errors = True

[mypy-frontend.*]
ignore_errors = True
