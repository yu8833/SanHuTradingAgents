name: Test Suite (Quality Gate)
# ============================================================
# L4 防线：push/PR 时 GitHub Actions 全量跑
# 所有测试都在容器中执行，不在 runner 上装本地依赖
# 失败 = 标红 = 不能合入
# ============================================================

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "frontend/src/**"
      - "frontend/tests/**"
      - "frontend/package.json"
      - "frontend/vitest.config.ts"
      - "tests/**"
      - "cli/**"
      - "scripts/git-hooks/**"
      - "docker-compose*.yml"
      - "Dockerfile.*"
      - "pytest.ini"
      - "ruff.toml"
      - "mypy.ini"
      - "requirements*.txt"
      - ".pre-commit-config.yaml"
      - ".github/workflows/test.yml"
  pull_request:
    branches: [main]

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---- Job 1: 后端静态检查（容器内） ----
  backend-static:
    name: Backend static checks (in container)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        # test 镜像 FROM tradingagents-backend:latest。runner 的 compose 版本较旧且
        # 无本地 daemon 镜像，直接 build test 会去 Docker Hub 拉同名镜像而失败。
        # 先用 docker build（默认 --load 到 daemon）生成本地 backend 镜像，再 build test。
        run: |
          docker build -f Dockerfile.backend -t tradingagents-backend:latest .
          docker compose build test

      - name: ruff lint (warn mode, non-blocking)
        run: |
          echo "=== ruff lint（报告但暂不阻止合并） ==="
          set +e
          docker compose run --rm --no-deps test ruff check app/ tests/ --output-format=concise 2>&1 | tail -30
          echo ""
          echo "ruff lint 已记录问题（下一轮批量修复）"

      - name: mypy (渐进收紧：报告错误但暂不阻止合并)
        run: |
          echo "=== mypy - 仅报告（渐进收紧，第一批 100 个） ==="
          docker compose run --rm --no-deps test mypy app/core app/services --config-file mypy.ini --no-error-summary --show-error-codes 2>&1 | head -100
          echo ""
          echo "（mypy 发现的错误暂不作为合并门禁（目前 1500+ 需要逐批修复，下一轮收紧到 1000 以下）"

  # ---- Job 2: 后端 unit + regression（容器内） ----
  backend-unit:
    name: Backend Unit + Regression (in container)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: backend-static
    steps:
      - uses: actions/checkout@v4

      - name: Build test image
        # test 镜像 FROM tradingagents-backend:latest。runner 的 compose 版本较旧且
        # 无本地 daemon 镜像，直接 build test 会去 Docker Hub 拉同名镜像而失败。
        # 先用 docker build（默认 --load 到 daemon）生成本地 backend 镜像，再 build test。
        run: |
          docker build -f Dockerfile.backend -t tradingagents-backend:latest .
          docker compose build test

      - name: Run unit + regression + coverage
        run: >
          docker compose run --rm --no-deps test
          python -m pytest
          -m "unit or regression"
          --ignore=tests/_archive
          --tb=short
          --strict-markers
          --timeout=60
          -v

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            coverage.xml

  # ---- Job 3: 后端集成冒烟（起 docker-compose 全栈，跑 smoke + contract） ----
  backend-smoke:
    name: Backend Smoke + Contract (docker-compose stack)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: backend-unit
    steps:
      - uses: actions/checkout@v4

      - name: Build and start services
        run: |
          cp .env.example .env || true
          docker compose up -d --build backend mongodb redis
          echo "等待 backend 健康..."
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8000/api/health >/dev/null 2>&1; then
              echo "✅ backend 健康"
              break
            fi
            sleep 5
            echo "  已等待 $((i*5))s..."
          done
          curl -sf http://localhost:8000/api/health

      - name: Build test image
        run: docker compose build test

      - name: Run smoke tests
        run: >
          docker compose run --rm test
          python -m pytest tests/smoke/ -m smoke
          --ignore=tests/_archive
          --tb=short
          --strict-markers
          --timeout=60
          -v

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "=== backend logs (last 200 行) ==="
          docker compose logs backend --tail=200 || true
          echo ""
          echo "=== worker logs (last 200 行) ==="
          docker compose logs worker --tail=200 || true

      - name: Shutdown
        if: always()
        run: docker compose down -v

  # ---- Job 4: 前端测试（容器内） ----
  frontend-test:
    name: Frontend Vitest (in container)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Run vitest in node container
        uses: addnab/docker-run-action@v3
        with:
          image: node:20-alpine
          options: -v ${{ github.workspace }}/frontend:/app -w /app
          run: |
            npm install --prefer-offline --no-audit --no-fund --loglevel=error 2>&1 | tail -20
            echo "=== 执行 Vitest 单元测试 ==="
            npm test 2>&1 | tail -60
            echo "=== 覆盖率报告 ==="
            npm run test:coverage 2>&1 | tail -40

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: |
            frontend/tests/coverage/
