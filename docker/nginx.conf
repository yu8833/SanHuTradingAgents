server {
    listen       80;
    server_name  _;

    # HTTP 重定向到 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen       443 ssl;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # SSL 证书配置
    ssl_certificate     /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json application/xml+rss;

    # Main location - SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # JavaScript files - content-hashed filenames allow long cache
    # 注意：JS/CSS 不存在时必须返回 404，不能回退到 index.html
    # 否则浏览器会把 HTML 当 JS 解析，触发 "页面加载失败" 错误
    location ~* ^/js/.*\.js$ {
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        try_files $uri =404;
    }

    # CSS files
    location ~* ^/css/.*\.css$ {
        add_header Cache-Control "public, max-age=604800, stale-while-revalidate=86400";
        try_files $uri =404;
    }

    # Other static assets
    location ~* \.(?:png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html - no cache
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # API proxy - forward /api/* to backend service
    location /api/ {
        resolver 127.0.0.11 valid=30s;
        set $backend_url http://backend:8000$request_uri;
        proxy_pass $backend_url;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;

        # Handle SSE/WebSocket long connections
        proxy_buffering off;
        proxy_cache off;
    }

    # Health check endpoint
    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}