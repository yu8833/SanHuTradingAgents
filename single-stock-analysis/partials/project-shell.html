<!-- TradingAgents Project Shell — Shared Fragment -->
<!-- Inherited by leaf pages: page-dashboard, page-analysis-result -->

<style>
  /* ── Nav item interactive states ── */
  .ssa-nav-item {
    display: flex;
    align-items: center;
    gap: var(--ssa-space-3);
    padding: var(--ssa-space-2) var(--ssa-space-4);
    border-radius: var(--ssa-radius-md);
    font-size: var(--ssa-font-size-base);
    color: var(--ssa-color-text-secondary);
    text-decoration: none;
    transition: background var(--ssa-transition-fast), color var(--ssa-transition-fast);
    cursor: pointer;
    border: none;
    background: transparent;
    width: 100%;
    text-align: left;
  }
  .ssa-nav-item:hover {
    background: var(--ssa-color-bg-hover);
    color: var(--ssa-color-text-primary);
  }
  .ssa-nav-item[data-active="true"] {
    background: var(--ssa-color-primary);
    color: var(--ssa-color-text-inverse);
    font-weight: var(--ssa-font-weight-medium);
  }
  .ssa-nav-item[data-active="true"]:hover {
    background: var(--ssa-color-primary-600);
    color: var(--ssa-color-text-inverse);
  }

  /* ── Market pill states ── */
  .ssa-market-btn {
    padding: var(--ssa-space-1) var(--ssa-space-3);
    border-radius: 6px;
    font-size: var(--ssa-font-size-sm);
    font-weight: var(--ssa-font-weight-medium);
    background: transparent;
    color: var(--ssa-color-text-secondary);
    border: none;
    cursor: pointer;
    white-space: nowrap;
    transition: background var(--ssa-transition-fast), color var(--ssa-transition-fast);
  }
  .ssa-market-btn:hover {
    color: var(--ssa-color-text-primary);
  }
  .ssa-market-btn[data-active="true"] {
    background: var(--ssa-color-primary);
    color: var(--ssa-color-text-inverse);
  }
</style>

<div class="ssa-shell" style="display:flex; min-height:100vh; font-family: var(--ssa-font-family);">

  <!-- ══════════════════════════════════════════════ -->
  <!-- Sidebar                                        -->
  <!-- ══════════════════════════════════════════════ -->
  <aside class="ssa-sidebar" style="width:240px; min-width:240px; background:var(--ssa-color-bg-surface); border-right:1px solid var(--ssa-color-border-default); display:flex; flex-direction:column; height:100vh; position:sticky; top:0; z-index:10;">

    <!-- Brand mark -->
    <div style="padding:var(--ssa-space-6) var(--ssa-space-6) var(--ssa-space-10); display:flex; align-items:center; gap:var(--ssa-space-3);">
      <div style="width:32px; height:32px; border-radius:var(--ssa-radius-md); background:var(--ssa-color-primary); display:flex; align-items:center; justify-content:center; flex-shrink:0;">
        <!-- CSS-only trend icon -->
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      </div>
      <span style="font-size:var(--ssa-font-size-lg); font-weight:var(--ssa-font-weight-semibold); color:var(--ssa-color-text-primary); letter-spacing:-0.01em;">TradingAgents</span>
    </div>

    <!-- SLOT: activeNavItem -->
    <!-- Leaf pages set data-active="true" on the matching nav item -->

    <!-- Navigation -->
    <nav style="flex:1; padding:0 var(--ssa-space-3); display:flex; flex-direction:column; gap:2px;">

      <a data-dom-id="nav-dashboard" data-nav-key="dashboard" href="#" class="ssa-nav-item" data-active="false">
        <i data-lucide="layout-dashboard" style="width:20px; height:20px; flex-shrink:0;"></i>
        <span>仪表盘</span>
      </a>

      <a data-dom-id="nav-result" data-nav-key="result" href="#" class="ssa-nav-item" data-active="false">
        <i data-lucide="bar-chart-3" style="width:20px; height:20px; flex-shrink:0;"></i>
        <span>分析结果</span>
      </a>

      <a data-nav-key="history" href="#" class="ssa-nav-item" data-active="false">
        <i data-lucide="clock" style="width:20px; height:20px; flex-shrink:0;"></i>
        <span>分析历史</span>
      </a>

      <!-- Divider -->
      <div style="height:1px; background:var(--ssa-color-border-default); margin:var(--ssa-space-4) var(--ssa-space-4);"></div>

      <a data-nav-key="settings" href="#" class="ssa-nav-item" data-active="false">
        <i data-lucide="settings" style="width:20px; height:20px; flex-shrink:0;"></i>
        <span>系统设置</span>
      </a>

    </nav>

    <!-- User (bottom) -->
    <div style="padding:var(--ssa-space-4) var(--ssa-space-6); border-top:1px solid var(--ssa-color-border-default); display:flex; align-items:center; gap:var(--ssa-space-3);">
      <div style="width:32px; height:32px; border-radius:var(--ssa-radius-full); background:var(--ssa-color-primary-100); color:var(--ssa-color-primary); display:flex; align-items:center; justify-content:center; font-size:var(--ssa-font-size-sm); font-weight:var(--ssa-font-weight-semibold); flex-shrink:0;">A</div>
      <span style="font-size:var(--ssa-font-size-sm); color:var(--ssa-color-text-secondary); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">Admin</span>
    </div>

  </aside>

  <!-- ══════════════════════════════════════════════ -->
  <!-- Main Wrapper                                    -->
  <!-- ══════════════════════════════════════════════ -->
  <div class="ssa-main-wrapper" style="flex:1; display:flex; flex-direction:column; min-width:0;">

    <!-- ── Top Bar ── -->
    <header class="ssa-topbar" style="height:56px; min-height:56px; background:var(--ssa-color-bg-surface); border-bottom:1px solid var(--ssa-color-border-default); display:flex; align-items:center; justify-content:space-between; padding:0 var(--ssa-space-8); position:sticky; top:0; z-index:10;">

      <!-- Left: page title -->
      <div data-page-title class="ssa-page-title" style="display:flex; align-items:center; min-width:0;">
        <!-- SLOT: pageTitle — leaf pages replace this comment with an <h1> -->
      </div>

      <!-- Right: controls -->
      <div style="display:flex; align-items:center; gap:var(--ssa-space-4); flex-shrink:0;">

        <!-- Market selector pill -->
        <div style="display:inline-flex; background:var(--ssa-color-bg-sunken); border-radius:var(--ssa-radius-md); padding:2px;">
          <button class="ssa-market-btn" data-active="true">A股</button>
          <button class="ssa-market-btn" data-active="false">美股</button>
          <button class="ssa-market-btn" data-active="false">港股</button>
        </div>

        <!-- Notification bell -->
        <button style="width:36px; height:36px; border-radius:var(--ssa-radius-md); background:transparent; border:1px solid var(--ssa-color-border-default); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--ssa-color-text-secondary); position:relative; transition:background var(--ssa-transition-fast);" onmouseover="this.style.background='var(--ssa-color-bg-hover)'" onmouseout="this.style.background='transparent'">
          <i data-lucide="bell" style="width:18px; height:18px;"></i>
          <span style="position:absolute; top:7px; right:7px; width:7px; height:7px; background:var(--ssa-state-error); border-radius:var(--ssa-radius-full);"></span>
        </button>

        <!-- User dropdown -->
        <button style="display:flex; align-items:center; gap:var(--ssa-space-2); padding:var(--ssa-space-1) var(--ssa-space-2); border-radius:var(--ssa-radius-md); background:transparent; border:none; cursor:pointer; transition:background var(--ssa-transition-fast);" onmouseover="this.style.background='var(--ssa-color-bg-hover)'" onmouseout="this.style.background='transparent'">
          <div style="width:28px; height:28px; border-radius:var(--ssa-radius-full); background:var(--ssa-color-primary); color:var(--ssa-color-text-inverse); display:flex; align-items:center; justify-content:center; font-size:var(--ssa-font-size-xs); font-weight:var(--ssa-font-weight-semibold); flex-shrink:0;">A</div>
          <i data-lucide="chevron-down" style="width:14px; height:14px; color:var(--ssa-color-text-tertiary);"></i>
        </button>

      </div>
    </header>

    <!-- ── Content — leaf pages inject here ── -->
    <main class="ssa-content" style="flex:1; padding:var(--ssa-space-6); overflow-y:auto;">
      <!-- SLOT: leafPageContent -->
    </main>

  </div>

</div>
