version: '3.8'

# SanHuTradingAgents Docker Compose配置
# 支持前后端分离部署

services:
  # FastAPI 后端服务
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: tradingagents-backend:latest
    container_name: tradingagents-backend
    ports:
      - "8000:8000"
    volumes:
      # 日志目录映射
      - ./logs:/app/logs
      # 配置目录映射
      - ./config:/app/config
      # 数据目录映射
      - ./data:/app/data
      # 源代码映射（开发模式 - 本地修改自动生效）
      - ./app:/app/app
      - ./tradingagents:/app/tradingagents
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      TZ: "Asia/Shanghai"
      # 日志配置
      TRADINGAGENTS_LOG_LEVEL: "INFO"
      TRADINGAGENTS_LOG_DIR: "/app/logs"
      TRADINGAGENTS_LOG_FILE: "/app/logs/tradingagents.log"
      # Docker专用数据库配置
      TRADINGAGENTS_MONGODB_URL: mongodb://admin:tradingagents123@mongodb:27017/tradingagentscn?authSource=admin
      TRADINGAGENTS_REDIS_URL: redis://:tradingagents123@redis:6379
      TRADINGAGENTS_CACHE_TYPE: redis
      # 启用MongoDB缓存（优先使用MongoDB中的同步数据）
      TA_USE_APP_CACHE: "true"
      # Docker环境标识
      DOCKER_CONTAINER: "true"
      # API配置
      API_HOST: "0.0.0.0"
      API_PORT: "8000"
      # CORS配置
      CORS_ORIGINS: "https://localhost,http://localhost,https://192.168.10.16,http://192.168.10.16"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tradingagents-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 60s
      timeout: 60s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # 分析任务Worker服务（独立进程，消费队列中的分析任务）
  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: tradingagents-backend:latest
    container_name: tradingagents-worker
    volumes:
      # 日志目录映射
      - ./logs:/app/logs
      # 配置目录映射
      - ./config:/app/config
      # 数据目录映射
      - ./data:/app/data
      # 源代码映射（开发模式 - 本地修改自动生效）
      - ./app:/app/app
      - ./tradingagents:/app/tradingagents
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      TZ: "Asia/Shanghai"
      # 日志配置
      TRADINGAGENTS_LOG_LEVEL: "INFO"
      TRADINGAGENTS_LOG_DIR: "/app/logs"
      TRADINGAGENTS_LOG_FILE: "/app/logs/worker.log"
      # Docker专用数据库配置
      TRADINGAGENTS_MONGODB_URL: mongodb://admin:tradingagents123@mongodb:27017/tradingagentscn?authSource=admin
      TRADINGAGENTS_REDIS_URL: redis://:tradingagents123@redis:6379
      TRADINGAGENTS_CACHE_TYPE: redis
      # 启用MongoDB缓存（优先使用MongoDB中的同步数据）
      TA_USE_APP_CACHE: "true"
      # Docker环境标识
      DOCKER_CONTAINER: "true"
      # Worker角色标识
      WORKER_ROLE: "analysis"
    depends_on:
      backend:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tradingagents-network
    restart: unless-stopped
    command: ["python", "-m", "app.worker.analysis_worker"]
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # 回测Worker服务（独立进程，消费回测任务队列）
  # 与后端解耦：后端重启/升级不会杀掉正在运行的回测任务
  backtest_worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    image: tradingagents-backend:latest
    container_name: tradingagents-backtest-worker
    volumes:
      # 日志目录映射
      - ./logs:/app/logs
      # 配置目录映射
      - ./config:/app/config
      # 数据目录映射
      - ./data:/app/data
      # 源代码映射（开发模式 - 本地修改自动生效）
      - ./app:/app/app
      - ./tradingagents:/app/tradingagents
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      TZ: "Asia/Shanghai"
      # 日志配置
      TRADINGAGENTS_LOG_LEVEL: "INFO"
      TRADINGAGENTS_LOG_DIR: "/app/logs"
      TRADINGAGENTS_LOG_FILE: "/app/logs/backtest_worker.log"
      # Docker专用数据库配置
      TRADINGAGENTS_MONGODB_URL: mongodb://admin:tradingagents123@mongodb:27017/tradingagentscn?authSource=admin
      TRADINGAGENTS_REDIS_URL: redis://:tradingagents123@redis:6379
      TRADINGAGENTS_CACHE_TYPE: redis
      # 启用MongoDB缓存（优先使用MongoDB中的同步数据）
      TA_USE_APP_CACHE: "true"
      # Docker环境标识
      DOCKER_CONTAINER: "true"
      # Worker角色标识
      WORKER_ROLE: "backtest"
    depends_on:
      backend:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tradingagents-network
    restart: unless-stopped
    command: ["python", "-m", "app.worker.backtest_worker"]
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # Vue 3 前端服务
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: tradingagents-frontend:latest
    container_name: tradingagents-frontend
    ports:
      - "443:443"
      - "80:80"
    environment:
      TZ: "Asia/Shanghai"
      # 后端API地址（Docker部署留空，使用Nginx代理 /api/）
      VITE_API_BASE_URL: ""
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - tradingagents-network
    healthcheck:
      # 使用 127.0.0.1 而非 localhost（避免解析到 IPv6 ::1 导致连接拒绝），
      # 并跳过自签名证书校验
      test: ["CMD", "wget", "--quiet", "--tries=1", "--no-check-certificate", "--spider", "https://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  # MongoDB 数据库服务
  mongodb:
    image: mongo:4.4
    container_name: tradingagents-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: tradingagents123
      MONGO_INITDB_DATABASE: tradingagentscn
      TZ: "Asia/Shanghai"
    # 显式限制 WiredTiger 缓存大小，避免 MongoDB 独占 VM 内存，
    # 给回测任务（需加载大量行情数据）留出更多内存余量。
    # entrypoint 会自动追加 --auth 与 --bind_ip_all。
    command: ["mongod", "--wiredTigerCacheSizeGB", "1"]
    volumes:
      - mongodb_data:/data/db
      - ./scripts/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - tradingagents-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongo localhost:27017/test --quiet
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "2"

  # Redis 缓存服务
  redis:
    image: redis:7-alpine
    container_name: tradingagents-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    environment:
      TZ: "Asia/Shanghai"
    command: redis-server --appendonly yes --requirepass tradingagents123
    volumes:
      - redis_data:/data
    networks:
      - tradingagents-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "tradingagents123", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "2"

  # 测试服务（基于 backend 镜像，额外装测试依赖）
  # 用法：
  #   docker compose run --rm test                          # 默认跑 unit+regression
  #   docker compose run --rm test pytest -m smoke          # 跑冒烟测试
  #   docker compose run --rm test ruff check app/ tests/   # 静态检查
  #   docker compose run --rm test mypy app/                # 类型检查
  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    image: tradingagents-test:latest
    container_name: tradingagents-test
    volumes:
      # 源代码映射（与 backend 一致，确保测试最新代码）
      - ./app:/app/app
      - ./tradingagents:/app/tradingagents
      - ./tests:/app/tests
      - ./scripts:/app/scripts
      - ./config:/app/config
      # 前端源码映射（防回归测试需要扫描前端文件）
      - ./frontend:/app/frontend
      # Dockerfile 挂载（bug-004 防回归测试需要扫描 Dockerfile.backend 里的 --workers 配置）
      - ./Dockerfile.backend:/app/Dockerfile.backend:ro
      - ./Dockerfile.frontend:/app/Dockerfile.frontend:ro
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
      TZ: "Asia/Shanghai"
      # 测试目标：同网络内的 backend 服务
      TEST_BASE_URL: "http://backend:8000"
      TEST_ADMIN_USER: "admin"
      TEST_ADMIN_PASS: "admin123"
      # Docker专用数据库配置
      TRADINGAGENTS_MONGODB_URL: mongodb://admin:tradingagents123@mongodb:27017/tradingagentscn?authSource=admin
      TRADINGAGENTS_REDIS_URL: redis://:tradingagents123@redis:6379
      TRADINGAGENTS_CACHE_TYPE: redis
      DOCKER_CONTAINER: "true"
    depends_on:
      backend:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - tradingagents-network
    # 测试容器用完即销毁，不需要 restart 策略
    restart: "no"
    profiles:
      - test

  # Redis Commander 管理界面（可选）
  redis-commander:
    image: ghcr.io/joeferner/redis-commander:latest
    container_name: tradingagents-redis-commander
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379:0:tradingagents123
    networks:
      - tradingagents-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8081"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    profiles:
      - management

  # Mongo Express 管理界面（可选）
  mongo-express:
    image: mongo-express:latest
    container_name: tradingagents-mongo-express
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: tradingagents123
      ME_CONFIG_MONGODB_URL: mongodb://admin:tradingagents123@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: tradingagents123
    networks:
      - tradingagents-network
    depends_on:
      mongodb:
        condition: service_healthy
    profiles:
      - management

# 数据卷定义
# ⚠️ 注意：执行 `docker compose down -v` 会删除这些卷，导致所有数据丢失！
# 日常重启请使用 `docker compose down`（不加 -v）
volumes:
  mongodb_data:
    driver: local
    name: tradingagents_mongodb_data
  redis_data:
    driver: local
    name: tradingagents_redis_data

# 网络定义
networks:
  tradingagents-network:
    driver: bridge
    name: tradingagents-network

